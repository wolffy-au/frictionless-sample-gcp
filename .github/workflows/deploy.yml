# Deploys sample-gcp when a version tag (v*) is pushed, or on demand from
# the Actions tab (Run workflow) to test a branch first, by running deploy.sh.
# One-time setup (identity, permissions, GitHub settings): setup-github-deploy.sh.
name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # Run workflow: deploy the chosen branch to production

permissions:
  contents: read
  id-token: write # sign in to the cloud with GitHub's OIDC token, no stored keys

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs the history and tags

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up the Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false # deploy.sh reads terraform's plain output

      - name: Deploy
        run: bash deploy.sh
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          LOCATION: ${{ vars.LOCATION }}
          AUTO_APPROVE: "1"
          # Verify providers against the committed lock file without adding
          # this platform's hashes, which would make the build version -dirty.
          TF_CLI_ARGS_init: -lockfile=readonly
